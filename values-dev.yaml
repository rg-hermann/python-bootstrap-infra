# Valores para ambiente de DESENVOLVIMENTO

k8s-helm-templates:
  replicaCount: 1
  image:
    repository: ghcr.io/rg-hermann/python-bootstrap
    tag: fa214a47388a4d7484445dc69453abb9f1c78aee
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: python-bootstrap.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
